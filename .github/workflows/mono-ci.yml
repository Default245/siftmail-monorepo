name: Monorepo CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint backend
        run: ruff check backend/app backend/tests

      - name: Test backend
        run: pytest backend/tests

      - name: Build backend
        run: python -m compileall backend/app

  frontend:
    name: Frontend lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install --workspace @siftmail/frontend

      - name: Lint frontend
        run: npm run lint --workspace @siftmail/frontend

      - name: Test frontend
        run: npm run test --workspace @siftmail/frontend

      - name: Build frontend
        run: npm run build --workspace @siftmail/frontend
